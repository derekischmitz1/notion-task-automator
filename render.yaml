services:
  - type: web
    name: notion-task-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notion-db
          property: connectionString
      - key: NOTION_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000

  - type: cron
    name: notion-sync-job
    env: node
    schedule: "*/5 * * * *"
    buildCommand: npm install && npm run build
    startCommand: node dist/jobs/cron-runner.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notion-db
          property: connectionString
      - key: NOTION_API_KEY
        sync: false

databases:
  - name: notion-db
    databaseName: notiontasks
    user: notionuser
    plan: free