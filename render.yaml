services:
  - type: web
    name: notion-task-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: notion-db
          property: connectionString
      - key: NOTION_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DAILY_TASKS_DB_ID
        sync: false
      - key: ASSIGNMENTS_DB_ID
        sync: false

databases:
  - name: notion-db
    databaseName: notiontasks
    user: notionuser
    plan: free